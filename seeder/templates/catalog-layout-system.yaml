# =============================================================================
# Catalog Layout — System
# Applies to: kind: System
#
# Purpose: Platform-owner view of an entire system (e.g. Payments System,
# Loan Processing System). Shows aggregate health, telemetry, blast radius,
# and on-call for the platform as a whole — not individual components.
#
# Tabs:
#   Overview | Telemetry | Wiz | Blast Radius | Chaos Engineering | K8s Ops | On-call / Incidents
#
# Annotations reference: seeder/templates/catalog-info.seed.yaml (System section)
# =============================================================================

page:
  name: system-default-layout
  path: /
  title: System
  tabs:

    # ─────────────────────────────────────────────────────────────────────────
    # Overview — platform identity, owned components, APIs
    # ─────────────────────────────────────────────────────────────────────────
    - name: Overview
      path: /
      title: Overview
      contents:
        - component: EntityAboutCard
          gridProps:
            md: 6
        - component: EntityOwnershipCard
          gridProps:
            md: 6
        - component: EntityHasComponentsCard
          gridProps:
            md: 12
        - component: EntityHasApisCard
          gridProps:
            md: 12

    # ─────────────────────────────────────────────────────────────────────────
    # Telemetry — system-level aggregate dashboard
    # One dashboard covering the whole platform — Datadog or Dynatrace
    # Teams fill whichever observability tool their platform uses
    # ─────────────────────────────────────────────────────────────────────────
    - name: Telemetry
      path: /telemetry
      title: Telemetry
      contents:
        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Datadog
            items:
              - label: System Dashboard
                value: <+metadata.annotations["datadoghq.com/system-dashboard-url"]>
                type: link

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Dynatrace
            items:
              - label: System Dashboard
                value: <+metadata.annotations["dynatrace.com/system-dashboard-url"]>
                type: link

    # ─────────────────────────────────────────────────────────────────────────
    # Wiz — platform-level cloud security posture across all services in this system
    # Uses wiz.io/project-id annotation set to a platform-scoped Wiz project
    # ─────────────────────────────────────────────────────────────────────────
    - name: Wiz
      path: /wiz
      title: Wiz
      contents:
        - component: EntityWizIssues
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6
        - component: EntityIssuesWidget
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6
        - component: EntityIssuesChart
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6
        - component: EntitySeverityChart
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6

    # ─────────────────────────────────────────────────────────────────────────
    # Blast Radius — full platform dependency graph + validation findings
    # Graph shows all components in this system and their external dependencies
    # Annotation findings written nightly by the cross-reference pipeline
    # ─────────────────────────────────────────────────────────────────────────
    - name: Blast Radius
      path: /blast-radius
      title: Blast Radius
      contents:
        - component: EntityCatalogGraphCard
          gridProps:
            md: 12

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Validation Status
            items:
              - label: Last Validated
                value: <+metadata.annotations["blast-radius/last-validated"]>
                type: text
              - label: Tier-1 Dependents
                value: <+metadata.annotations["blast-radius/tier-1-dependents"]>
                type: text
              - label: Transitive Blast Radius
                value: <+metadata.annotations["blast-radius/transitive-count"]>
                type: text

    # ─────────────────────────────────────────────────────────────────────────
    # Chaos Engineering — Harness Chaos Engineering resilience view for this system
    # chaos.harness.io/project-id links the HCE project that scopes experiments
    # for all services belonging to this platform.
    # Resilience score and experiment count written nightly by the chaos pipeline.
    # ─────────────────────────────────────────────────────────────────────────
    - name: Chaos Engineering
      path: /chaos
      title: Chaos Engineering
      contents:
        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Resilience
            items:
              - label: Resilience Score
                value: <+metadata.annotations["chaos.harness.io/resilience-score"]>
                type: text
              - label: Experiments Configured
                value: <+metadata.annotations["chaos.harness.io/experiment-count"]>
                type: text
              - label: Last Run
                value: <+metadata.annotations["chaos.harness.io/last-run-date"]>
                type: text

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Harness Chaos Engineering
            items:
              - label: HCE Project Dashboard
                value: <+metadata.annotations["chaos.harness.io/dashboard-url"]>
                type: link
              - label: GameDay Runbook
                value: <+metadata.annotations["chaos.harness.io/gameday-runbook-url"]>
                type: link

    # ─────────────────────────────────────────────────────────────────────────
    # Rafay — SRE fleet management view for this platform's Kubernetes footprint
    # System level = Rafay project scope: all clusters, namespaces, RBAC, workloads
    # Requires: IDP Admin -> Plugins -> Rafay -> Enable + configure API credentials
    # Annotation: rafay.dev/project-name set to this system's identifier
    # ─────────────────────────────────────────────────────────────────────────
    - name: K8s Ops
      path: /k8s-ops
      title: K8s Ops
      contents:
        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Fleet Overview
            items:
              - label: Rafay Project
                value: <+metadata.annotations["rafay.dev/project-name"]>
                type: text
              - label: Project Dashboard
                value: <+metadata.annotations["rafay.dev/project-dashboard-url"]>
                type: link

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Operations
            items:
              - label: Cluster Count
                value: <+metadata.annotations["rafay.dev/cluster-count"]>
                type: text
              - label: Namespace Count
                value: <+metadata.annotations["rafay.dev/namespace-count"]>
                type: text
              - label: Last Fleet Sync
                value: <+metadata.annotations["rafay.dev/last-sync"]>
                type: text

    # ─────────────────────────────────────────────────────────────────────────
    # On-call / Incidents — platform-level on-call and incident view
    # Who owns this system during an incident, not individual component owners
    # ─────────────────────────────────────────────────────────────────────────
    - name: On-call / Incidents
      path: /oncall
      title: On-call / Incidents
      contents:
        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: On-call
            items:
              - label: Platform Team
                value: <+metadata.annotations["oncall/team"]>
                type: text
              - label: Rotation Schedule
                value: <+metadata.annotations["oncall/rotation-url"]>
                type: link

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Incidents
            items:
              - label: Incident Dashboard
                value: <+metadata.annotations["oncall/incidents-url"]>
                type: link
