apiVersion: harness.io/v1
kind: Workflow
name: update-catalog-entry
identifier: update_catalog_entry
type: service
owner: platform_engineering
orgIdentifier: default
projectIdentifier: xxx-IDP-project
icon: scaffolder
metadata:
  description: >
    Add Resources and APIs to your service catalog entry. Supports databases,
    caches, Kafka, IBM MQ, FTP servers, REST APIs and async APIs — all in one
    submission. Commits directly to your repo master branch.
  tags:
    - catalog
    - platform
    - self-service

spec:
  parameters:
    - title: Select Service
      required:
        - componentIdentifier
      properties:
        accountId:
          title: Account ID
          type: string
          default: "ACCOUNT_ID"
          disabled: true

        componentIdentifier:
          title: Service Component
          type: string
          description: "Select the service you want to update"
          ui:field: SelectFieldFromApi
          ui:options:
            path: proxy/catalog-api/v1/entities?filter=kind=Component
            valueSelector: identifier
            labelSelector: metadata.title
            setContextData:
              sysid: metadata.annotations.bank.com/sysid
              systemIdentifier: spec.system.0
              ownerGroup: spec.owner
              repoSlug: metadata.annotations.github.com/project-slug
          ui:autofocus: true

        sysid:
          title: SYSID
          type: string
          ui:field: ContextViewer
          readonly: true
          getContextData: "{{formContext.sysid}}"

        systemIdentifier:
          title: System
          type: string
          ui:field: ContextViewer
          readonly: true
          getContextData: "{{formContext.systemIdentifier}}"

        ownerGroup:
          title: Owner Group
          type: string
          ui:field: ContextViewer
          readonly: true
          getContextData: "{{formContext.ownerGroup}}"

        repoSlug:
          title: Repository
          type: string
          ui:field: ContextViewer
          readonly: true
          getContextData: "{{formContext.repoSlug}}"

    - title: System (optional)
      properties:
        updateSystem:
          title: Update System information?
          type: string
          enum:
            - "No"
            - "Yes"
          default: "No"

      dependencies:
        updateSystem:
          oneOf:
            - properties:
                updateSystem:
                  const: "No"
            - properties:
                updateSystem:
                  const: "Yes"
                systemTitle:
                  title: System Title
                  type: string
                  description: "Display name — e.g. Payments Platform"
                  ui:placeholder: "System Title - e.g. Payments Platform"
                systemDescription:
                  title: System Description
                  type: string
                  ui:widget: textarea
                  ui:options:
                    rows: 3
                  ui:placeholder: "System Description - what does this platform do?"
                systemDomain:
                  title: Domain
                  type: string
                  enum:
                    - banking
                    - lending
                    - risk
                    - payments
                    - operations
                    - data
                systemConfluence:
                  title: Confluence URL
                  type: string
                  ui:placeholder: "Confluence URL - https://confluence.bank.com/display/PROJ"
                systemRunbook:
                  title: Runbook URL
                  type: string
                  ui:placeholder: "Runbook URL - https://runbooks.bank.com/platform-name"
                systemTags:
                  title: Tags
                  type: string
                  description: "Comma-separated — e.g. payments,tier-1"
                  ui:placeholder: "Tags - e.g. payments,tier-1"
                systemKubernetesClusters:
                  title: Kubernetes Clusters
                  type: string
                  description: "Comma-separated list of cluster names this platform spans — powers system-level cluster registry"
                  ui:placeholder: "Kubernetes Clusters - e.g. prod-eks-us-east-1,dr-eks-us-west-2"
                systemDatadogDashboardUrl:
                  title: System Datadog Dashboard URL
                  type: string
                  description: "Platform-wide dashboard covering all components in this system"
                  ui:placeholder: "Datadog Dashboard URL - https://app.datadoghq.com/dashboard/<id>"
                systemDynatraceDashboardUrl:
                  title: System Dynatrace Dashboard URL
                  type: string
                  ui:placeholder: "Dynatrace Dashboard URL - https://company.live.dynatrace.com/#dashboard;id=<id>"
                systemOncallTeam:
                  title: System On-call Team
                  type: string
                  ui:placeholder: "On-call Team - e.g. payments-platform-sre"
                systemOncallRotationUrl:
                  title: System On-call Rotation URL
                  type: string
                  ui:placeholder: "Rotation URL - link to ServiceNow on-call schedule"
                systemOncallIncidentsUrl:
                  title: System Incidents URL
                  type: string
                  ui:placeholder: "Incidents URL - link to ServiceNow platform incident view"
                systemWizProjectId:
                  title: System Wiz Project ID
                  type: string
                  description: "Platform-scoped Wiz project — shows aggregate security posture across all services in this system"
                  ui:placeholder: "Wiz Project ID — platform-level project in Wiz console"
              required:
                - systemTitle
                - systemDescription
                - systemDomain

    - title: Service Info
      properties:
        componentDescription:
          title: Service Description
          type: string
          description: "What this service does — shown on the catalog entity page"
          ui:widget: textarea
          ui:options:
            rows: 3
          ui:placeholder: "Service Description - e.g. Handles payment processing for retail banking customers"
        componentConfluenceUrl:
          title: Confluence URL
          type: string
          ui:placeholder: "Confluence URL - https://confluence.bank.com/display/PAY"
        componentRunbookUrl:
          title: Runbook URL
          type: string
          ui:placeholder: "Runbook URL - https://runbooks.bank.com/payments-service"

    - title: Resources
      properties:
        databases:
          title: Databases
          type: array
          description: "Add one entry per database this service owns"
          items:
            type: object
            required:
              - name
              - engine
              - description
            properties:
              name:
                title: Resource Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — must match target: in now.yaml databases section. e.g. payments-postgres"
                ui:placeholder: "Resource Name - e.g. payments-postgres"
              engine:
                title: Engine
                type: string
                enum:
                  - postgresql
                  - mysql
                  - oracle
                  - mssql
                  - mongodb
              description:
                title: Description
                type: string
                ui:placeholder: "Description - engine version, hosting, HA setup"
                ui:widget: textarea
                ui:options:
                  rows: 2

        caches:
          title: Caches
          type: array
          description: "Add one entry per cache this service owns"
          items:
            type: object
            required:
              - name
              - engine
              - description
            properties:
              name:
                title: Resource Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — must match target: in now.yaml databases section (engine redis/memcached). e.g. payments-redis"
                ui:placeholder: "Resource Name - e.g. payments-redis"
              engine:
                title: Engine
                type: string
                enum:
                  - redis
                  - memcached
              description:
                title: Description
                type: string
                ui:placeholder: "Description - engine version, hosting, replication"
                ui:widget: textarea
                ui:options:
                  rows: 2

        kafkaClusters:
          title: Kafka Clusters
          type: array
          description: "Add one entry per Kafka cluster this service owns"
          items:
            type: object
            required:
              - name
              - description
            properties:
              name:
                title: Resource Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — must match target: in now.yaml kafka section. e.g. payments-kafka"
                ui:placeholder: "Resource Name - e.g. payments-kafka"
              bootstrapServers:
                title: Bootstrap Servers
                type: string
                ui:placeholder: "Bootstrap Servers - e.g. kafka.bank.com:9092"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - auth method, management, purpose"
                ui:widget: textarea
                ui:options:
                  rows: 2

        mqBrokers:
          title: IBM MQ Brokers
          type: array
          description: "Add one entry per IBM MQ broker this service owns"
          items:
            type: object
            required:
              - name
              - description
            properties:
              name:
                title: Resource Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — must match target: in now.yaml mq section. e.g. payments-ibmmq"
                ui:placeholder: "Resource Name - e.g. payments-ibmmq"
              host:
                title: Host
                type: string
                ui:placeholder: "Host - e.g. mqserver.bank.com:1414"
              queueManager:
                title: Queue Manager
                type: string
                ui:placeholder: "Queue Manager - e.g. QM1"
              channel:
                title: Channel
                type: string
                ui:placeholder: "Channel - e.g. APP.SVRCONN"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - auth method, queues managed"
                ui:widget: textarea
                ui:options:
                  rows: 2

        ftpServers:
          title: FTP Servers
          type: array
          description: "Add one entry per FTP server this service owns"
          items:
            type: object
            required:
              - name
              - description
            properties:
              name:
                title: Resource Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — must match target: in now.yaml ftp section. e.g. payments-ftp"
                ui:placeholder: "Resource Name - e.g. payments-ftp"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - host, protocol, partners, purpose"
                ui:widget: textarea
                ui:options:
                  rows: 2

        kubernetesWorkloads:
          title: Kubernetes Workloads
          type: array
          description: "Add one entry per Kubernetes cluster or namespace this service deploys to. Powers the Backstage Kubernetes plugin."
          items:
            type: object
            required:
              - cluster
              - namespace
              - labelSelector
              - environment
            properties:
              cluster:
                title: Cluster Name
                type: string
                description: "EKS cluster or AKS cluster name"
                ui:placeholder: "Cluster Name - e.g. prod-eks-us-east-1"
              namespace:
                title: Namespace
                type: string
                ui:placeholder: "Namespace - e.g. payments"
              labelSelector:
                title: Label Selector
                type: string
                description: "Kubernetes label selector to identify workload pods"
                ui:placeholder: "Label Selector - e.g. app.kubernetes.io/name=payments-service"
              environment:
                title: Environment
                type: string
                enum:
                  - dev
                  - qa
                  - prod
                ui:widget: select

    - title: Observability & Quality
      properties:
        wizProjectId:
          title: Wiz Project ID
          type: string
          description: "Wiz project identifier — activates cloud security posture cards in the catalog"
          ui:placeholder: "Wiz Project ID — find in Wiz console → Projects"
        datadogDashboardUrl:
          title: Datadog Dashboard URL
          type: string
          ui:placeholder: "Datadog Dashboard URL - https://app.datadoghq.com/dashboard/<id>"
        datadogServiceName:
          title: Datadog Service Name
          type: string
          ui:placeholder: "Datadog Service Name - e.g. loan-app"
        dynatraceDashboardUrl:
          title: Dynatrace Dashboard URL
          type: string
          ui:placeholder: "Dynatrace Dashboard URL - https://company.live.dynatrace.com/#dashboard;id=<id>"
        dynatraceEntityId:
          title: Dynatrace Entity ID
          type: string
          ui:placeholder: "Dynatrace Entity ID - e.g. SERVICE-abc123"
        sonarqubeProjectKey:
          title: SonarQube Project Key
          type: string
          ui:placeholder: "SonarQube Project Key - e.g. loan-app"
        sonarqubeDashboardUrl:
          title: SonarQube Dashboard URL
          type: string
          ui:placeholder: "SonarQube Dashboard URL - https://sonarqube.company.com/dashboard?id=loan-app"
        qualityCoverageTarget:
          title: Coverage Target (%)
          type: string
          ui:placeholder: "Coverage Target - e.g. 80"
        qualityDoraDashboardUrl:
          title: DORA / SEI Dashboard URL
          type: string
          ui:placeholder: "DORA Dashboard URL - link to SEI dashboard for this service"

    - title: On-call & Database Info
      properties:
        oncallTeam:
          title: On-call Team
          type: string
          ui:placeholder: "On-call Team - e.g. lending-platform-team"
        oncallRotationUrl:
          title: Rotation Schedule URL
          type: string
          ui:placeholder: "Rotation Schedule URL - link to PagerDuty or ServiceNow schedule"
        oncallIncidentsUrl:
          title: Incident Dashboard URL
          type: string
          ui:placeholder: "Incident Dashboard URL - link to ServiceNow or incident view"
        oncallLastIncidentDate:
          title: Last Incident Date
          type: string
          ui:placeholder: "Last Incident Date - e.g. 2026-04-15"
        dbEngine:
          title: Database Engine
          type: string
          enum:
            - ""
            - postgresql
            - mysql
            - oracle
            - mssql
            - mongodb
          enumNames:
            - "Not applicable"
            - PostgreSQL
            - MySQL
            - Oracle
            - MSSQL
            - MongoDB
          default: ""
        dbSchema:
          title: Database Schema
          type: string
          ui:placeholder: "Database Schema - e.g. loan_schema"
        dbDbaRunbookUrl:
          title: DBA Runbook URL
          type: string
          ui:placeholder: "DBA Runbook URL - link to DBA team runbook for this service"
        dbLastMigration:
          title: Last Migration Date
          type: string
          ui:placeholder: "Last Migration Date - e.g. 2026-04-15"
        dbBackupPolicy:
          title: Backup Policy
          type: string
          enum:
            - ""
            - daily-7d
            - daily-30d
            - weekly-90d
            - none
          enumNames:
            - "Not applicable"
            - Daily - 7 day retention
            - Daily - 30 day retention
            - Weekly - 90 day retention
            - No backup
          default: ""

    - title: APIs
      properties:
        restApis:
          title: REST APIs
          type: array
          description: "Add one entry per REST API this service exposes"
          items:
            type: object
            required:
              - name
              - endpoint
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-rest-api"
                ui:placeholder: "API Name - e.g. orders-rest-api"
              endpoint:
                title: Base URL
                type: string
                ui:placeholder: "Base URL - e.g. https://api.bank.com/orders"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - who calls this, auth method, rate limits"
                ui:widget: textarea
                ui:options:
                  rows: 2

        kafkaProducers:
          title: Kafka Producers
          type: array
          description: "Add one entry per Kafka topic this service publishes to"
          items:
            type: object
            required:
              - name
              - topic
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-kafka-producer"
                ui:placeholder: "API Name - e.g. orders-kafka-producer"
              topic:
                title: Topic
                type: string
                ui:placeholder: "Topic - e.g. orders.events.order-created"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what events are published and who consumes them"
                ui:widget: textarea
                ui:options:
                  rows: 2

        kafkaConsumers:
          title: Kafka Consumers
          type: array
          description: "Add one entry per Kafka topic this service subscribes to"
          items:
            type: object
            required:
              - name
              - topic
              - consumerGroup
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-kafka-consumer"
                ui:placeholder: "API Name - e.g. orders-kafka-consumer"
              topic:
                title: Topic
                type: string
                ui:placeholder: "Topic - e.g. fraud.events.fraud-decision"
              consumerGroup:
                title: Consumer Group
                type: string
                ui:placeholder: "Consumer Group - e.g. orders-fraud-consumer"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what topic and what this service does with it"
                ui:widget: textarea
                ui:options:
                  rows: 2

        mqProducers:
          title: MQ Producers
          type: array
          description: "Add one entry per MQ queue this service publishes to"
          items:
            type: object
            required:
              - name
              - queueName
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-mq-producer"
                ui:placeholder: "API Name - e.g. orders-mq-producer"
              queueName:
                title: Queue Name
                type: string
                ui:placeholder: "Queue Name - e.g. ORDERS.INSTRUCTIONS.OUTBOUND"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what messages are published and who consumes them"
                ui:widget: textarea
                ui:options:
                  rows: 2

        mqConsumers:
          title: MQ Consumers
          type: array
          description: "Add one entry per MQ queue this service reads from"
          items:
            type: object
            required:
              - name
              - queueName
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-mq-consumer"
                ui:placeholder: "API Name - e.g. orders-mq-consumer"
              queueName:
                title: Queue Name
                type: string
                ui:placeholder: "Queue Name - e.g. ORDERS.INSTRUCTIONS.INBOUND"
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what messages are consumed and what drives it"
                ui:widget: textarea
                ui:options:
                  rows: 2

        ftpOutbound:
          title: FTP Outbound
          type: array
          description: "Add one entry per FTP path this service deposits files to"
          items:
            type: object
            required:
              - name
              - path
              - contentType
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-ftp-outbound"
                ui:placeholder: "API Name - e.g. orders-ftp-outbound"
              path:
                title: FTP Path
                type: string
                ui:placeholder: "FTP Path - e.g. /outbound/settlement/{date}"
              contentType:
                title: Content Type
                type: string
                enum:
                  - text/csv
                  - application/xml
                  - application/json
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what files are deposited, schedule, who picks them up"
                ui:widget: textarea
                ui:options:
                  rows: 2

        ftpInbound:
          title: FTP Inbound
          type: array
          description: "Add one entry per FTP path this service reads files from"
          items:
            type: object
            required:
              - name
              - path
              - contentType
              - description
            properties:
              name:
                title: API Name
                type: string
                pattern: "^[a-z][a-z0-9-]+$"
                description: "kebab-case — e.g. orders-ftp-inbound"
                ui:placeholder: "API Name - e.g. orders-ftp-inbound"
              path:
                title: FTP Path
                type: string
                ui:placeholder: "FTP Path - e.g. /inbound/instructions/{date}"
              contentType:
                title: Content Type
                type: string
                enum:
                  - text/csv
                  - application/xml
                  - application/json
              description:
                title: Description
                type: string
                ui:placeholder: "Description - what files are read, who deposits them, schedule"
                ui:widget: textarea
                ui:options:
                  rows: 2

  steps:
    - id: log_inputs
      name: Log Catalog Update Inputs
      action: debug.log
      input:
        message: >
          component={{ parameters.componentIdentifier }},
          sysid={{ parameters.sysid }},
          system={{ parameters.systemIdentifier }},
          updateSystem={{ parameters.updateSystem }}

    - id: trigger_pipeline
      name: Trigger Update Catalog Pipeline
      action: trigger:harness-custom-pipeline
      input:
        pipeline: update_catalog_entry_pipeline
        payload:
          componentIdentifier: "{{ parameters.componentIdentifier }}"
          repoSlug: "{{ parameters.repoSlug }}"
          sysid: "{{ parameters.sysid }}"
          systemIdentifier: "{{ parameters.systemIdentifier }}"
          ownerGroup: "{{ parameters.ownerGroup }}"
          componentDescription: "{{ parameters.componentDescription or '' }}"
          componentConfluenceUrl: "{{ parameters.componentConfluenceUrl or '' }}"
          componentRunbookUrl: "{{ parameters.componentRunbookUrl or '' }}"
          updateSystem: "{{ parameters.updateSystem }}"
          systemTitle: "{{ parameters.systemTitle or '' }}"
          systemDescription: "{{ parameters.systemDescription or '' }}"
          systemDomain: "{{ parameters.systemDomain or '' }}"
          systemConfluence: "{{ parameters.systemConfluence or '' }}"
          systemRunbook: "{{ parameters.systemRunbook or '' }}"
          systemTags: "{{ parameters.systemTags or '' }}"
          systemDatadogDashboardUrl: "{{ parameters.systemDatadogDashboardUrl or '' }}"
          systemDynatraceDashboardUrl: "{{ parameters.systemDynatraceDashboardUrl or '' }}"
          systemOncallTeam: "{{ parameters.systemOncallTeam or '' }}"
          systemOncallRotationUrl: "{{ parameters.systemOncallRotationUrl or '' }}"
          systemOncallIncidentsUrl: "{{ parameters.systemOncallIncidentsUrl or '' }}"
          systemWizProjectId: "{{ parameters.systemWizProjectId or '' }}"
          wizProjectId: "{{ parameters.wizProjectId or '' }}"
          datadogDashboardUrl: "{{ parameters.datadogDashboardUrl or '' }}"
          datadogServiceName: "{{ parameters.datadogServiceName or '' }}"
          dynatraceDashboardUrl: "{{ parameters.dynatraceDashboardUrl or '' }}"
          dynatraceEntityId: "{{ parameters.dynatraceEntityId or '' }}"
          sonarqubeProjectKey: "{{ parameters.sonarqubeProjectKey or '' }}"
          sonarqubeDashboardUrl: "{{ parameters.sonarqubeDashboardUrl or '' }}"
          qualityCoverageTarget: "{{ parameters.qualityCoverageTarget or '' }}"
          qualityDoraDashboardUrl: "{{ parameters.qualityDoraDashboardUrl or '' }}"
          oncallTeam: "{{ parameters.oncallTeam or '' }}"
          oncallRotationUrl: "{{ parameters.oncallRotationUrl or '' }}"
          oncallIncidentsUrl: "{{ parameters.oncallIncidentsUrl or '' }}"
          oncallLastIncidentDate: "{{ parameters.oncallLastIncidentDate or '' }}"
          dbEngine: "{{ parameters.dbEngine or '' }}"
          dbSchema: "{{ parameters.dbSchema or '' }}"
          dbDbaRunbookUrl: "{{ parameters.dbDbaRunbookUrl or '' }}"
          dbLastMigration: "{{ parameters.dbLastMigration or '' }}"
          dbBackupPolicy: "{{ parameters.dbBackupPolicy or '' }}"
          databases: "{{ parameters.databases | dump }}"
          caches: "{{ parameters.caches | dump }}"
          kafkaClusters: "{{ parameters.kafkaClusters | dump }}"
          mqBrokers: "{{ parameters.mqBrokers | dump }}"
          ftpServers: "{{ parameters.ftpServers | dump }}"
          restApis: "{{ parameters.restApis | dump }}"
          kafkaProducers: "{{ parameters.kafkaProducers | dump }}"
          kafkaConsumers: "{{ parameters.kafkaConsumers | dump }}"
          mqProducers: "{{ parameters.mqProducers | dump }}"
          mqConsumers: "{{ parameters.mqConsumers | dump }}"
          ftpOutbound: "{{ parameters.ftpOutbound | dump }}"
          ftpInbound: "{{ parameters.ftpInbound | dump }}"
          kubernetesWorkloads: "{{ parameters.kubernetesWorkloads | dump }}"
          systemKubernetesClusters: "{{ parameters.systemKubernetesClusters or '' }}"
          requestorName: "${{ user.entity.metadata.name }}"
          requestorEmail: "${{ user.entity.spec.profile.email or user.entity.metadata.name }}"

  output:
    text:
      title: Catalog Update Submitted
      content: >
        Your catalog update has been submitted. The pipeline will append the
        new entities to your catalog-info.yaml, validate and commit to master.
        Each new entity will be registered in IDP automatically.
      summary:
        component: "{{ parameters.componentIdentifier }}"
        system: "{{ parameters.systemIdentifier }}"
        updateSystem: "{{ parameters.updateSystem }}"
        requestor: "${{ user.entity.metadata.name }}"
    links:
      - title: View Pipeline Execution
        url: "https://app.harness.io/ng/account/{{ parameters.accountId }}/module/idp-admin/orgs/default/projects/xxx-IDP-project/pipelines/update_catalog_entry_pipeline/executions"
