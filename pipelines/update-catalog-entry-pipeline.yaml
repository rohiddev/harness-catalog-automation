                          FTP_OUTBOUND='<+pipeline.variables.ftpOutbound>' \
                          FTP_INBOUND='<+pipeline.variables.ftpInbound>' \
                          COMPONENT_DESCRIPTION="<+pipeline.variables.componentDescription>" \
                          COMPONENT_CONFLUENCE_URL="<+pipeline.variables.componentConfluenceUrl>" \
                          COMPONENT_RUNBOOK_URL="<+pipeline.variables.componentRunbookUrl>" \
                          SYSTEM_DATADOG_DASHBOARD_URL="<+pipeline.variables.systemDatadogDashboardUrl>" \
                          SYSTEM_DYNATRACE_DASHBOARD_URL="<+pipeline.variables.systemDynatraceDashboardUrl>" \
