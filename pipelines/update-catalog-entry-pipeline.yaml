                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                            onRetryFailure:
                              action:
                                type: Abort

    - stage:
        name: Register Entities in IDP
        identifier: register_entities
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Register All New Entities
                  identifier: register_all_entities
                  type: ShellScript
                  spec:
                    shell: Bash
                    delegateSelectors:
                      - act-delegate-k8s-ephub-p2r1
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          HARNESS_API_KEY=<+secrets.getValue("vault://secret/data/platform/harness#api_key")>
                          ACCOUNT_ID=<+account.identifier>
                          CATALOG_FILE=/tmp/catalog-update-repo/catalog-info.yaml

                          # Split multi-doc YAML into individual files
                          csplit --quiet --prefix=/tmp/catalog-doc- \
                            --suffix-format="%03d.yaml" \
                            "$CATALOG_FILE" "/^---/" "{*}" 2>/dev/null || true

                          for doc in /tmp/catalog-doc-*.yaml; do
                            [ -f "$doc" ] || continue
                            grep -q "apiVersion:" "$doc" || continue

                            echo "Registering $doc"
                            HTTP_STATUS=$(curl -s -o /tmp/register-response.json \
                              -w "%{http_code}" \
                              --retry 3 --retry-delay 5 --retry-connrefused \
                              -X POST \
                              "https://app.harness.io/gateway/idp/api/v1/entities?accountIdentifier=${ACCOUNT_ID}" \
                              -H "x-api-key: ${HARNESS_API_KEY}" \
                              -H "Content-Type: application/yaml" \
                              --data-binary @"$doc")

                            if [ "$HTTP_STATUS" -ge 400 ]; then
                              echo "WARNING: registration failed for $doc (HTTP $HTTP_STATUS)"
                              cat /tmp/register-response.json
                            else
                              echo "Registered $doc (HTTP $HTTP_STATUS)"
                            fi
                          done
                          echo "registration complete"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore

    - stage:
        name: Notify on Failure
        identifier: notify_on_failure
        type: Custom
        when:
          pipelineStatus: Failure
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Ignore
        spec:
          execution:
            steps:
              - step:
                  name: Send Failure Email
                  identifier: send_failure_email
                  type: ShellScript
                  spec:
                    shell: Bash
                    delegateSelectors:
                      - act-delegate-k8s-ephub-p2r1
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          EMAIL_API_KEY=<+secrets.getValue("vault://secret/data/platform/email#api_key")>
                          curl -s --retry 3 --retry-delay 5 --retry-connrefused \
                            -X POST https://email.bank.com/send \
                            -H "Authorization: Bearer ${EMAIL_API_KEY}" \
                            -H "Content-Type: application/json" \
                            -d "{
                              \"to\": \"<+pipeline.variables.requestorEmail>\",
                              \"subject\": \"Catalog Update Failed - <+pipeline.variables.componentIdentifier>\",
                              \"body\": \"Your catalog update for <+pipeline.variables.componentIdentifier> failed. Check pipeline: https://app.harness.io/ng/account/<+account.identifier>/module/idp-admin/orgs/default/projects/xxx-IDP-project/pipelines/update_catalog_entry_pipeline/executions\"
                            }"
                          echo "failure notification sent"
